<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnderWorld Tale - Personajes</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>UnderWorld Tale</h1>
    <p class="header-subtitle">Conoce a los personajes del reino oscuro</p>
  </header>

  <nav class="categorias">
    <button class="btn-categoria active" id="btn-inicio"     onclick="mostrarSeccion('inicio')">Inicio</button>
    <button class="btn-categoria"        id="btn-personajes" onclick="mostrarSeccion('personajes')">Personajes</button>
    <button class="btn-categoria"        id="btn-episodios"  onclick="mostrarSeccion('episodios')">Mis Episodios</button>
    <button class="btn-categoria"        id="btn-contacto"   onclick="mostrarSeccion('contacto')">Contacto</button>
  </nav>

  <nav class="subcategorias" id="subcategorias-personajes">
    <button class="btn-subcategoria active" onclick="filtrarSubcategoria('melinoe', this)">Melinoë</button>
    <button class="btn-subcategoria"        onclick="filtrarSubcategoria('mis_coqueteos', this)">Mis coqueteos</button>
    <button class="btn-subcategoria"        onclick="filtrarSubcategoria('inframundo', this)">Inframundo</button>
    <button class="btn-subcategoria"        onclick="filtrarSubcategoria('olimpo', this)">Olimpo</button>
  </nav>
  <nav class="subcategorias" id="subcategorias-episodios" style="display:none;"></nav>

  <main class="main-container">
    <section class="personajes-grid" id="personajesGrid">
      <!-- Contenido cargado por JavaScript -->
    </section>
  </main>

  <!-- Reproductor flotante -->
  <audio id="musicaFondo" loop autoplay>
    <source src="./images/música.mp3" type="audio/mpeg">
  </audio>

  <div class="reproductor" id="reproductor">
    <button class="btn-play" id="btnPlay" title="Play / Pausa">▶</button>
    <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.5" title="Volumen">
    <span class="icono-volumen">♪</span>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 text-center">
          <p>© 2026 UnderWorld Tale · Todos los derechos reservados</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Swiper -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
